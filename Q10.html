<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>TP2 - Question 10 (Modal)</title>
  <style>
    .modal-overlay {
      display: none; 
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.5); 
      justify-content: center;
      align-items: center;
    }
 .modal-content {
      background-color: white;
      padding: 20px;
      border-radius: 8px;
      width: 300px;
      text-align: center;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    }
    button {
      padding: 8px 16px;
      cursor: pointer;
    }
  </style>
</head>

  
  <h2>Modal de notification</h2>

  
  <button id="btnOuvrir">Ouvrir la modale</button>

  <div id="maModal" class="modal-overlay">
    <div class="modal-content">
      <h3>Notification</h3>
      <p>Ceci est un message de notification dans la modale.</p>
      <button id="btnFermer">Fermer</button>
    </div>
  </div>

  <script>
     let modal = document.getElementById("maModal");
    let btnOuvrir = document.getElementById("btnOuvrir");
    let btnFermer = document.getElementById("btnFermer");
btnOuvrir.addEventListener("click", function() {
      modal.style.display = "flex"; 
    });
  btnFermer.addEventListener("click", function() {
      modal.style.display = "none"; 
    });
  </script>

</body>
</html>
