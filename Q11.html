<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>TP2 - Question 11 </title>
  <style>
    .container {
      width: 350px;
      font-family: Arial, sans-serif;
    }
    #recherche {
      width: 100%;
      padding: 8px;
      margin-bottom: 15px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    .produit {
      padding: 10px;
      border: 1px solid #ddd;
      margin-bottom: 5px;
      border-radius: 4px;
      background-color: #f9f9f9;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Liste de Produits</h2>

    <input type="text" id="recherche" placeholder="Rechercher un produit...">
    <div id="listeProduits">
      <div class="produit">Ordinateur Portable</div>
      <div class="produit">Smartphone</div>
      <div class="produit">Casque Audio</div>
      <div class="produit">Écran LED</div>
      <div class="produit">Clavier Mécanique</div>
      <div class="produit">Souris Sans Fil</div>
    </div>
      </div>
       <script>
    let champRecherche = document.getElementById("recherche");
    let produits = document.getElementsByClassName("produit");
    champRecherche.addEventListener("input", function() {
      let filtre = champRecherche.value.toLowerCase();
      for (let i = 0; i < produits.length; i++) {
        let texteProduit = produits[i].textContent.toLowerCase();
        if (texteProduit.indexOf(filtre) !== -1) {
          produits[i].style.display = "block";
        } else {
          produits[i].style.display = "none"; 
        }
      }
    });
  </script>

</body>
</html>
