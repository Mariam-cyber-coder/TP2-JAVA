<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>TP2 - Question 1</title>
  <style>
    #maDiv {
      width: 200px;
      height: 100px;
      background-color: lightgray; 
      border: 2px solid black;
      margin-bottom: 10px;
    }

  </style>
</head>
<body>
  <div id="maDiv"></div>
  <button id="monBouton">Changer la couleur</button>
<script>
  let div=document.getElementById("ma div");
  let button=document.getElementById("monBouton");
  button.addEventListener("click",function {
    if(div.style.backgroundColor === "lightblue")  {
            div.style.backgroundColor = "lightgray";
      } else {
        div.style.backgroundColor = "lightblue";
      }
    });  

  
</script>

</body>
</html>
