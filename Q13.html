<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>TP2 - Question 13 </title>
  <style>
    .container {
      width: 350px;
      font-family: Arial, sans-serif;
    }
    .barre-fond {
      width: 100%;
      background-color: #e0e0e0;
      border-radius: 10px;
      height: 25px;
      margin-bottom: 15px;
      overflow: hidden;
      border: 1px solid #ccc;
    }
  #maBarre {
      width: 0%; 
      height: 100%;
      background-color: #4caf50; 
      text-align: center;
      line-height: 25px;
      color: white;
      font-weight: bold;
      transition: width 0.1s;
    }

    button {
      padding: 8px 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Barre de Progression</h2>
<div class="barre-fond">
      <div id="maBarre">0%</div>
    </div>
    <button id="btnDemarrer">Démarrer</button>
  </div>
  <script>
    let barre = document.getElementById("maBarre");
    let bouton = document.getElementById("btnDemarrer");
    bouton.addEventListener("click", function() {
      let largeur = 0; 
      barre.style.width = "0%";
      barre.textContent = "0%";
   let intervalle = setInterval(function() {
        if (largeur >= 100) {
          // Arrêter la progression quand on atteint 100%
          clearInterval(intervalle);
        } else {
          largeur = largeur + 1;
           }
      }, 50);
    });
  </script>

</body>
</html>
