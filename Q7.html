<body>
<h2>timer</h2>
<div class="timer-container">
<p>Temps ecoule:<span id="temps">0</span>Secondes</p>

</div>
<script>
let secondes=0;
let tempsElement=document.getElementById("temps");
setInterval(function(){
secondes=secondes+1;
tempsElement.textContent=secondes;
 },1000 )
</script>
